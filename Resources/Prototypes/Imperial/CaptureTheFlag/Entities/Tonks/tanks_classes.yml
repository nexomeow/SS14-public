- type: entity
  parent: [BaseTank, TankCombat, TankDamageable, InventoryTankBase]
  id: PlayableTank
  name: tonk
  description: Steel and lead.
  abstract: true
  components:
  - type: Gun
    projectileSpeed: 30
    fireRate: 0.5
    angleDecay: 45
    minAngle: 0
    maxAngle: 5
    soundGunshot:
      path: /Audio/Imperial/CaptureTheFlag/Tanks/Shots/middle_tank.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
#  - type: BallisticAmmoProvider
#    whitelist:
#      tags:
#      - TonkProjectiles
#    capacity: 100
#    proto: TonkProjectileMT

- type: entity
  parent: PlayableTank
  id: CTFLightTank
  name: LTTB-L
  suffix: TonkCTF, LT, Tank
  components:
  - type: Sprite
    sprite: Imperial/CaptureTheFlag/Tanks/lttb_l.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: Gun
    projectileSpeed: 20
    fireRate: 0.42
    angleDecay: 45
    minAngle: 2
    maxAngle: 12
    soundGunshot:
      path: /Audio/Imperial/CaptureTheFlag/Tanks/Shots/light_tank.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: TonkProjectileLT
    fireCost: 1
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: TonkProjectileLT #Бронебойный
      fireCost: 1
    - proto: TonkProjectileLTS #Подкалибер
      fireCost: 1
  - type: Battery
    maxCharge: 50
    startingCharge: 50
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 3
  - type: MobThresholds
    thresholds:
      0: Alive
      1150: Critical
      1151: Dead
#  - type: Reflect
#    reflectProb: .05
#    spread: 120
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.8
  - type: FootstepModifier
    footstepSoundCollection:
      collection: TanksTracksLight
      params:
        volume: -12
  - type: Loadout
    prototypes: [ LightTank ]
  - type: MouseRotator
    rotationSpeed: 110

