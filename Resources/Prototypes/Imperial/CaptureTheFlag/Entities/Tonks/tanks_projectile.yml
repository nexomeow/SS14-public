# AP - Бронебойный. Базовый снаряд.
# Sub и Cumulative - Подкалибреный и кумулятивный соответственно. Улучшенные снаряды. Игнорят броню, но у них пониженный урон.
# HE - Осколочно-фугасный. Огромный урон, но только по слабо бронированным целям.

#Light-Tank

- type: entity
  id: TonkProjectileLT
  name: AP
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: piercing
  - type: Projectile
    damage:
      types:
        Piercing: 210

- type: entity
  id: TonkProjectileLTS
  name: Sub
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: rubber
  - type: Projectile
    damage:
      types:
        Piercing: 175
    ignoreResistances: true

