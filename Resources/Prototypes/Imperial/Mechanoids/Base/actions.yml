- type: soundCollection
  id: MechWeaponSound
  files:
    - /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg

- type: entity
  parent: BaseAction
  id: ActionMechTurnVision
  name: Turn mech vision
  description: Turn special vision
  components:
  - type: Action
    useDelay: 2
    raiseOnUser: true
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_borg.rsi
      state: no-action
    clientExclusive: true
  - type: InstantAction
    event: !type:MechTurnNightVisionEvent

- type: entity
  parent: BaseAction
  id: BaseActionMechHandGive
  name: BuiltIn Weapon
  description: placeholder
  abstract: true
  components:
  - type: Action
    useDelay: 2
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_borg.rsi
      state: no-action
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: MechWeaponLmg
    summonSounds:
      collection: MechWeaponSound
    retractSounds:
      collection: MechWeaponSound

