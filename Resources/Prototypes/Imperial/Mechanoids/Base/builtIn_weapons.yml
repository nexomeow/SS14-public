- type: entity
  name: BaseRangedMechWeapon
  parent: BaseItem
  id: BaseRangedMechWeapon
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: DisarmMalus
    malus: 0
  - type: Sprite
    state: icon
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
  - type: MultiHandedItem
  - type: Item
    sprite: Objects/Weapons/Guns/Rifles/ak.rsi
    size: Ginormous
    shape:
    - 0,0,3,2
  - type: AmmoCounter
  - type: Gun
    fireRate: 5
    selectedMode: FullAuto
    availableModes:
      - FullAuto
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/batrifle.ogg
  - type: PredictedBattery
    maxCharge: 20
    startingCharge: 20
  - type: PredictedBatterySelfRecharger
    autoRechargeRate: 1
  - type: BatteryAmmoProvider
    proto: BulletLightRifle
    fireCost: 1
  - type: StaticPrice
    price: 3000

- type: entity
  name: mechanoid lmg
  parent: BaseRangedMechWeapon
  id: MechWeaponLmg
  description: A mechanoid LMG.
  components:
  - type: Sprite
    sprite: Imperial/Other/CS/Weapon/mp5.rsi
    state: icon
  - type: Item
    sprite: Imperial/Other/CS/Weapon/mp5.rsi
  - type: BatteryAmmoProvider
    proto: BulletPistol
    fireCost: 1
  - type: Appearance

- type: entity
  name: mechanoid hmg
  parent: BaseRangedMechWeapon
  id: MechWeaponHmg
  description: A mechanoid HMG.
  components:
  - type: Gun
    minAngle: 4
    maxAngle: 12
    angleIncrease: 4
    angleDecay: 10
    fireRate: 7
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: PredictedBattery
    maxCharge: 80
    startingCharge: 80
  - type: BatteryAmmoProvider
    proto: BulletLightRifle
    fireCost: 1
  - type: PredictedBatterySelfRecharger
    autoRechargeRate: 2
  - type: Appearance

- type: entity
  parent: Katana
  id: MeleeslasherSwords
  name: slasher swords
  description: A mechanoid swords.
  components:
  - type: Sprite
    sprite: Imperial/Mechanoids/Items/slasher_swords.rsi
    color: "#b2c5bb"
  - type: Item
    sprite: Imperial/Mechanoids/Items/slasher_swords.rsi
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Slash: 15
  - type: Reflect
    reflectingInHands: true
    reflectProb: 0.5
    spread: 15
  - type: MultiHandedItem

- type: entity
  parent: MeleeslasherSwords
  id: PraetorianMeleeslasherSwords
  name: praetorian slasher swords
  description: A mechanoid elite swords.
  components:
  - type: Sprite
    color: "#8d6484"
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Slash: 20
  - type: Reflect
    reflectProb: 0.7
    spread: 10

- type: entity
  parent: MeleeslasherSwords
  id: WalverdeMeleeslasherSwords
  name: walverde slasher swords
  description: A mechanoid swords of the Walverde.
  components:
  - type: Sprite
    color: "#aab651"
  - type: MeleeWeapon
    attackRate: 1.7
    damage:
      types:
        Slash: 20
        Blunt: 10
  - type: Reflect
    reflectProb: 0.75
    spread: 5
