- type: entity
  parent: [BaseMob, StripableInventoryBase]
  id: BaseMechanoid
  name: mechanoid
  save: false
  abstract: true
  components:
  - type: Mechanoid
  - type: NpcFactionMember
    factions:
    - Passive
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CombatMode
    canDisarm: false
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 8
  - type: NoSlip
  - type: StaticPrice
    price: 3000
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 4.5
  - type: Gibbable
  - type: Sprite
    sprite: Imperial/Mechanoids/Base/foundation.rsi
    layers:
    - map: [ "enum.MechanoidVisualLayers.Chest" ]
      state: body
    - map: [ "enum.MechanoidVisualLayers.Head" ]
      state: head
    - map: [ "enum.MechanoidVisualLayers.Eyes" ]
      state: eyes
    - map: [ "enum.MechanoidVisualLayers.LLeg" ]
      state: l_leg
    - map: [ "enum.MechanoidVisualLayers.RLeg" ]
      state: r_leg
    - map: [ "enum.MechanoidVisualLayers.AddsLayer" ]
    - map: [ "enum.MechanoidVisualLayers.LHand" ]
      state: l_hand
    - map: [ "enum.MechanoidVisualLayers.RHand" ]
      state: r_hand
    - map: [ "enum.MechanoidVisualLayers.ChevronLayer" ]
      state: chevron
    - map: [ "back" ]
    - map: [ "head" ]
  - type: GenericVisualizer
    visuals:
      enum.MechanoidVisualLayers.Adds:
        enum.MechanoidVisualLayers.AddsLayer:
          True: { state: adds }
          False: { state: nothing }
      enum.MechanoidVisualLayers.Chevron:
        enum.MechanoidVisualLayers.ChevronLayer:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance
  - type: RotationVisuals
    horizontalRotation: 90
  - type: IdExaminable
  - type: Identity
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      500: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  - type: HealthExaminable
    examinableTypes:
      - Blunt
      - Slash
      - Piercing
      - Heat
      - Shock
    locPrefix: silicon
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: Inventory
    templateId: mechanoid_humanoid_inv
  - type: Hands
  - type: ComplexInteraction
  - type: Strippable
  - type: Stripping
  - type: IntrinsicRadioReceiver
  - type: ZombieImmune
  - type: Repairable
    doAfterDelay: 10
    allowSelfRepair: true
  - type: ContainerContainer
    containers:
      borg_brain: !type:ContainerSlot { }
      borg_module: !type:Container { }
      part-container: !type:Container
  - type: Body
    prototype: mechanoid_humanoid_body
  - type: StatusEffects
    allowed:
    - Flashed
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Vocal
    sounds:
      Unsexed: UnisexSilicon
    wilhelmProbability: 0.01
  - type: UnblockableSpeech
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSecurityCyborg
  - type: Damageable
    damageContainer: Silicon
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Pullable
  - type: Puller
    needsHands: false
  - type: StandingState
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CanPilot
    - SiliconEmotes
    - Unimplantable
  - type: Emoting
  - type: ProtectedFromStepTriggers
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10
