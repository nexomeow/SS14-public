- type: mechanoidsSquad
  id: MechSquadPraetorians
  name: mechanoid-squad-praetorians-name
  desc: mechanoid-squad-praetorians-desc
  squadColor: "#ca1d1d"
  componentsToAdd:
  - type: BriefingOnMinded
    briefProto: PraetoriansBrief
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [ MechanoidPraetorianStartingGear ]
  - type: RandomMetadata
    nameSegments:
    - PraetoriansFirst
    - PraetoriansSecond
  - type: GhostRole
    name: mechanoid-ghostrole-praetorians-name
    description: mechanoid-ghostrole-praetorians-desc
    rules: mechanoid-ghostrole-praetorians-rules
    raffle:
      settings: default
  - type: CrewSkills
    skills:
      - skillBotany #Base
      - skillBaseMed
      - skillBaseConstraction
      - skillCooking  #Easy
      - skillBartending
      - skillHacking
      - skillInstrumentation #Medium
      - skillMaintenance
      - skillMediumConstruction
      - skillMediumBotany
      - skillBasicAtmos
      - skillMedicalEquipment
      - skillPharmacology
      - skillPiloting #Hard
      - skillAtmos
      - skillHardInstrumentation
      - skillRobotics
      - skillResearch
      - skillPharmaceuticals
      - skillShooting
      - skillSurgery
      - skillNeuroSurgery
  staff:
  - MechanoidTechbotOM-P
  - MechanoidCarbineOM-P
  - MechanoidCarbineOM-P
  - MechanoidMeleeslasherOM-P
  - MechanoidMeleeslasherOM-P
  - MechanoidSpiderbotOM-P
