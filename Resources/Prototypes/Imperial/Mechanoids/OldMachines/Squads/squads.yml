- type: mechanoidsSquad
  id: MechSquadEngieswarm
  name: mechanoid-squad-Engieswarm-name
  desc: mechanoid-squad-Engieswarm-desc
  squadColor: "#ff8800"
  componentsToAdd:
  - type: BriefingOnMinded
    briefProto: EngiswarmBrief
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [ MechanoidEngieswarmStartingGear ]
  - type: RandomMetadata
    nameSegments:
    - PraetoriansFirst
    - PraetoriansSecond
  - type: GhostRole
    name: mechanoid-ghostrole-engieswarm-name
    description: mechanoid-ghostrole-engieswarm-desc
    rules: mechanoid-ghostrole-engieswarm-rules
    raffle:
      settings: default
  - type: CrewSkills
    skills:
      - skillBotany #Base
      - skillBaseMed
      - skillBaseConstraction
      - skillHacking #Easy
      - skillInstrumentation #Medium
      - skillMaintenance
      - skillBasicAtmos
      - skillPiloting #Hard
      - skillAtmos
      - skillHardInstrumentation
      - skillShooting
  staff:
  - MechanoidTechbotOM
  - MechanoidEngiebotOM
  - MechanoidEngiebotOM
  - MechanoidEngiebotOM
  - MechanoidCarbineOM
  - MechanoidCarbineOM

