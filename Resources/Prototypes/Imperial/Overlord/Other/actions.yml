##Залп из ядра.
- type: entity
  id: ActionCoreShotOverlord
  name: core shot
  description: The powerful shot from the core.
  components:
  - type: WorldTargetAction
    useDelay: 30
    itemIconStyle: BigAction
    checkCanAccess: false
    range: 60
    sound: !type:SoundPathSpecifier
      path: /Audio/Imperial/Overlord/core_fire.ogg
    icon:
      sprite: Imperial/Medieval/Gun/Charmer/blood.rsi
      state: 1
    event: !type:MedievalProjectileSpellEvent
      speechPoints:
        0:
          speech: overlord-coreshot-talk
          color: "#ff0000"
          hideChat: true
      projectilePrototype:
        2.5: CoreShotOverlord
      targetSpellType: TargetOnCurrentMousePosition
      projectileSpeed: 10
      spellCastDoAfter:
        delay: 2.5
        breakOnDropItem: false
        breakOnWeightlessMove: false
        breakOnMove: false
        needHand: false
        speedModifier: 0.3

- type: entity
  id: CoreShotOverlord
  name: core shot
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Overlord/Equippment/core_shot.rsi
    layers:
      - state: core_shot
        shader: unshaded
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 20000
    intensitySlope: 5
    maxIntensity: 50
  - type: PointLight
    radius: 4.5
    color: red
    energy: 3

- type: entity
  parent: BaseSubdermalImplant
  id: ActionCoreShotOverlordTaker
  name: :3
  components:
    - type: SubdermalImplant
      implantAction: ActionCoreShotOverlord
    - type: Tag
      tags:
        - SubdermalImplant
        - HideContextMenu
        - Flashlight
