## Feedbacker
- type: entity
  parent: BaseSubdermalImplant
  id: SupremeMachineAbilityFeedbackImplant ## Костыльная х....
  name: Feedback
  components:
    - type: SubdermalImplant
      implantAction: SupremeMachineAbilityFeedback
    - type: Tag
      tags:
        - SubdermalImplant
        - HideContextMenu
        - Flashlight

- type: entity
  id: BaseSupremeMachineAbilityFeedback
  name: nope-massage
  description: nope-massage
  components:
  - type: MedievalTargetSpell
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Imperial/Medieval/blackhole_cast.ogg
    icon:
      sprite: Imperial/Medieval/Gun/Charmer/blood.rsi
      state: 1

- type: entity
  id: SupremeMachineAbilityFeedback
  parent: BaseSupremeMachineAbilityFeedback
  name: feedback-ability-name
  description: feedback-ability-desc
  components:
  - type: MedievalTargetSpell
  - type: Action
    useDelay: 0.5
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Imperial/SupremeMachines/feedback.ogg
    icon:
      sprite: Imperial/SupremeMachines/Skills.rsi
      state: feedback_icon
  - type: TargetAction
    checkCanAccess: false
    range: 60
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: FeedbackerParryBullet
      projectileSpeed: 10

