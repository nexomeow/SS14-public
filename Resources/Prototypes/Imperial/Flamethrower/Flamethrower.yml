- type: entity
  name: base flame thrower
  parent: BaseItem
  id: BaseFlameThrower
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
    shape:
    - 0,0,4,3
  - type: Clothing
    sprite: Objects/Weapons/Guns/LMGs/l6.rsi
    quickEquip: false
    slots:
    - suitStorage
  - type: AmmoCounter
  - type: StaticPrice
    price: 500
  - type: UseDelay
    delay: 1

- type: entity
  id: FlameThrower
  parent: BaseFlameThrower
  name: flame thrower
  description: Created by catgirls, against the enemies of catgirls.
  components:
  - type: Sprite
    sprite: Imperial/Flamethrower/flamethrower.rsi
    layers:
    - state: icon
    - state: fire
      shader: unshaded
      visible: false
      map: ["enum.ToggleableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Large
    sprite: Imperial/Flamethrower/inhands.rsi
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
#Да
  - type: ItemToggle
    soundActivate:
      path: /Audio/Imperial/Flamethrower/flamethrower_on.ogg
    soundDeactivate:
      path: /Audio/Items/Lighters/lighter3.ogg
#  - type: ItemToggleActiveSound
#    activeSound:
#      path: /Audio/Weapons/ebladehum.ogg
  - type: MultiHandedItem
  - type: ComponentToggler
    components:
    - type: DisarmMalus
      malus: 0.6
    - type: Execution
      doAfterDuration: 4.0
    - type: Gun
      cameraRecoilScalar: 0
      projectileSpeed: 8
      fireRate: 15
      minAngle: 1
      maxAngle: 2
      angleIncrease: 0
      angleDecay: 0
      selectedMode: FullAuto
      availableModes:
        - FullAuto
      soundGunshot: /Audio/Imperial/Flamethrower/flamethrower_fire.ogg
    - type: ItemToggleHot
    - type: ItemToggleSize
      activatedSize: Huge
  - type: BallisticAmmoProvider
    proto: FlamethrowerBullet
    capacity: 1500 #Много топлива
