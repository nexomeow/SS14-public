- type: entity
  id: LeagueFlagRedTracker
  parent: BannerRed
  name: league red spawn point
  components:
  - type: PointLight
    color: red
    energy: 5
    radius: 5
    castShadows: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 900
        mask:
        - MachineMask
        layer:
        - Opaque
        - MidImpassable
        - HighImpassable
        - BulletImpassable
  - type: Sprite
    sprite: Imperial/ImperialLeague/CorporateMerchandise/decor.rsi
    state: banner_red

