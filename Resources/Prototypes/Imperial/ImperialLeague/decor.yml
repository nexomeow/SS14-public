  description: Баннер, анонсирующий лигу imperial space
  components:
  - type: Sprite
    sprite: Imperial/ImperialLeague/CorporateMerchandise/holo.rsi
    state: hologramanimation
    noRot: true
  - type: Transform
    noRot: true
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
