- type: entity
  id: Bannerfortheleague
  parent: BannerBase
  name: Лига imperial space
  suffix: league
  description: Баннер, анонсирующий лигу imperial space
  components:
  - type: Sprite
    sprite: Imperial/ImperialLeague/CorporateMerchandise/banner.rsi
    state: banner
    noRot: true
  - type: Transform
    noRot: true
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 190
        mask:
        - MachineMask
        layer:
        - Opaque
        - MidImpassable
        - HighImpassable
        - BulletImpassable
  - type: InteractionOutline

- type: entity
  id: HoloBannerfortheleague
